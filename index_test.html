    const y=S.att.find(z=>z!==x&&!z.gh&&z.sid===x.sid&&z.out&&Math.abs(z.in-x.in)<=6e5&&x.in<z.out);
    if(y){x.out=y.out;x.gh=1;x.fx=Date.now();ch=true}});

  }catch(e){SYS.st="err";SYS.msg=syMsg(e)}
  finally{SYB=false;sySaveL();syViewPill();syFlushView()}
}
function syFlushNow(){
  if(!SY.on||!SYD||SYB)return;
  SYB=true;syPushInner(syKey(),S,SYL).catch(()=>{}).finally(()=>{SYB=false;sySaveL()});
}
function syKick(){SYD=true;if(SY.on){clearTimeout(syKT);syKT=setTimeout(()=>syTick(true),900)}}
function syFlushView(){
  if(!SYV)return;const e=document.activeElement;
  if((e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName))||$(".mo,.ov"))return;
  SYV=false;view();
}
/* ----- giao diện ----- */
function syLabel(){return !SY.on?"Chưa bật đồng bộ":SYS.st==="err"?"Mất kết nối":SYS.st==="sync"?"Đang đồng bộ…":"Đã đồng bộ"+(SYS.t?" · "+tm(SYS.t):"")}
function syPill(){
  const c=!SY.on?"var(--mu)":SYS.st==="err"?"var(--bad)":SYS.st==="sync"?"var(--pr)":"var(--ok)";
  return `<a href="#caidat" class="syp${SY.on&&SYS.st==="err"?"":" ok"}" title="${esc(syLabel()+(SYS.msg&&SY.on?" · "+SYS.msg:""))}" onclick="sTab='dongbo';return PG==='caidat'?(view(),false):nav('caidat')"><span class="dot" style="background:${c};margin:0"></span><span class="lb" style="font-size:13px">${esc(syLabel())}</span></a>`;
}
function syViewPill(){const e=document.querySelector(".syp");if(e)e.outerHTML=syPill()}
function sSync(){
  const u=SYUI||{},own=isOwner(),on=SY.on;
  const card=(t,b)=>`<div class="card" style="max-width:760px;margin-bottom:14px"><b style="font-size:17px">${t}</b><div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">${b}</div></div>`;
  return card("Máy chủ dữ liệu",`<p class="mu" style="margin:0">Đơn, thực đơn, kho, chấm công và cài đặt được lưu trên máy chủ Supabase, tách riêng khỏi file phần mềm. Cập nhật hoặc thay file phần mềm không làm mất dữ liệu. Các máy nhập cùng một mã quán sẽ dùng chung dữ liệu.</p>
  <div class="row"><span class="mu">Trạng thái</span><b>${esc(syLabel())}</b></div>
  ${on&&SYS.msg?`<small style="color:var(--bad)">${esc(SYS.msg)}</small>`:""}
  ${own?`<label class="mf"><span>Mã quán</span><div class="r2" style="flex-wrap:nowrap"><input id="sy_c" value="${esc(SY.code)}" ${on?"readonly":""} placeholder="Dán mã từ máy khác, hoặc bấm Tạo mã mới" autocomplete="off" style="flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace"><button onclick="syGen()" ${on||u.busy?"disabled":""}>Tạo mã mới</button></div><small class="mu">Mã này là chìa khóa vào dữ liệu quán. Chỉ đưa cho người tin cậy. Nhập cùng mã trên mỗi máy để dùng chung dữ liệu.</small></label>`:""}
  ${u.err?`<small style="color:var(--bad)">${esc(u.err)}</small>`:""}
  ${u.choice?`<div class="card" style="background:var(--hov);box-shadow:none"><b>Máy chủ đã có dữ liệu cho mã này</b><p class="mu" style="margin:6px 0 12px">Chọn bên nào làm chuẩn.</p><div style="display:flex;flex-direction:column;gap:10px"><div><button class="p" onclick="syPick('server')">Dùng dữ liệu trên máy chủ</button><br><small class="mu">Dữ liệu hiện có trên máy này sẽ được thay bằng dữ liệu máy chủ.</small></div><div><button onclick="syPick('local')">Dùng dữ liệu của máy này</button><br><small class="mu">Món, bàn, nhân viên trên máy chủ sẽ bị thay bằng dữ liệu máy này. Lịch sử bán hàng đã có trên máy chủ vẫn được giữ.</small></div></div></div>`:""}
  ${own&&!on&&!u.choice?`<div><button class="p" onclick="syConnect()" ${u.busy?"disabled":""}>${u.busy?"Đang kết nối…":"Kết nối và bật đồng bộ"}</button></div>`:""}
  ${on?`<div class="r2"><button class="p" onclick="syTick(true)">Đồng bộ ngay</button>${own?`<button onclick="syOff()">Tắt đồng bộ</button>`:""}</div>`:""}
  <small class="mu">Đồng bộ chạy khi bạn mở phần mềm từ file đã đưa lên hosting hoặc mở trực tiếp trên máy. Trong khung xem trước của Claude, trình duyệt chặn kết nối ra ngoài nên đồng bộ không chạy được.</small>`);
}
function syGen(){const b=crypto.getRandomValues(new Uint8Array(16));$("#sy_c").value="quan-"+[...b].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function syConnect(){
  const code=(($("#sy_c")||{}).value||"").trim();
  if(code.length<24){SYUI={err:"Mã quán cần ít nhất 24 ký tự. Bấm Tạo mã mới, hoặc dán mã đang dùng ở máy khác."};view();return}
  SY.code=code;sySave();syLoad();SYUI={busy:1};view();
  try{
    const rows=await syRpc("pos_pull",{p_key:syKey(),p_since:null,p_limit:1});
    if(rows.length)SYUI={choice:1};
    else{SY.on=true;sySave();SYC={s:null,init:true};SYD=true;SYUI={};SYS={st:"sync",msg:"",t:0};await syTick(true)}
  }catch(e){SYUI={err:syMsg(e)}}
  view();
}
async function syPick(w){
  SYUI={busy:1};view();SY.on=true;sySave();SYB=true;
  try{
    const key=syKey(),rows=await syPullRows(key,true);SYL={};SYC={s:null,init:true};
    if(w==="server")syApply(rows,true,true);
    else rows.forEach(r=>{SYL[r.kind+"/"+r.rid]=r.deleted?"__del__":hsh(canon(r.data))});
    syMax(rows);SYD=true;SYUI={};SYS={st:"sync",msg:"",t:0};
  }catch(e){SY.on=false;sySave();SYUI={err:syMsg(e)}}
  finally{SYB=false}
  sySaveL();view();syTick(true);
}
function syOff(){SY.on=false;sySave();SYS={st:"off",msg:"",t:0};SYUI={};view()}
function syHook(){
  const sv=window.save;window.save=function(){const r=sv.apply(this,arguments);syKick();return r};
  const sw=window.switchStore;
  if(sw)window.switchStore=function(){syFlushNow();const r=sw.apply(this,arguments);syLoad();SYD=true;return r};
  const ds=window.delStore;
  if(ds)window.delStore=function(id){const n=CH.list.length,r=ds.apply(this,arguments);if(CH.list.length<n){SY.gone=[...new Set([...(SY.gone||[]),id])];sySave()}return r};
}
/* Máy mới mở link: tự nối vào quán bằng SB.code, không cần nhập mã. Che màn hình đến khi tải xong dữ liệu để không lộ giao diện chưa đăng nhập. */
async function syAuto(){
  const o=document.createElement("div");o.id="syw";o.style.cssText="position:fixed;inset:0;z-index:99999;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;text-align:center";document.body.appendChild(o);
  SY.code=SB.code;SY.on=true;sySave();syLoad();SYB=true;
  const run=async()=>{
    o.innerHTML='<div class="mu">Đang tải dữ liệu quán…</div>';SYB=true;SY.on=true;
    try{
      const rows=await syPullRows(syKey(),true);SYL={};SYC={s:null,init:true};
      if(rows.length){syApply(rows,true,true);syMax(rows)}
      SYD=true;SYS={st:"sync",msg:"",t:0};sySaveL();SYB=false;o.remove();view();syTick(true)
    }catch(e){SYB=false;SY.on=false;sySave();
      if(!location.hostname||/claude|anthropic/i.test(location.hostname)){o.remove();view();return}/* khung xem trước của Claude chặn mạng: cho chạy cục bộ để sửa giao diện; trên Netlify vẫn che */
      o.innerHTML='<div style="color:var(--bad)">'+esc(syMsg(e))+'</div><button class="p" id="syw_b">Thử lại</button>';$("#syw_b").onclick=run}
  };
  run();
}
function syBoot(){
  syLoad();syHook();SYD=true;
  if(SB.code&&(!SY.on||!SY.code))syAuto();
  setInterval(()=>{syTick();syFlushView()},4000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)syTick(true)});
  setTimeout(()=>syTick(true),400);
}

/* Cài lên màn hình chính (PWA) */
try{if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.hostname))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}
let IP=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();IP=e;const b=document.getElementById("ipb");if(b)b.hidden=false});addEventListener("appinstalled",()=>{IP=null;const b=document.getElementById("ipb");if(b)b.hidden=true});
function pwaInstall(){if(IP){IP.prompt();IP.userChoice.finally(()=>{IP=null;const b=document.getElementById("ipb");if(b)b.hidden=true})}}
dvApply();chk();
addEventListener("hashchange",()=>{const k=(location.hash||"#ban").slice(1);if(k!==PG)nav(k)});
view();
syBoot();
/* Tự nhận dạng thiết bị: phone / tablet / desktop, cập nhật khi xoay màn hình hoặc đổi kích thước cửa sổ */
function devFit(){const d=document.documentElement,w=innerWidth,ua=navigator.userAgent||'',tp=navigator.maxTouchPoints>1,touch=matchMedia('(pointer:coarse)').matches||tp,tab=/iPad|Tablet|PlayBook|Silk/i.test(ua)||(/Android/i.test(ua)&&!/Mobile/i.test(ua))||(navigator.platform==='MacIntel'&&tp);const k=w<700?'phone':(tab||(touch&&w<1400)||w<900)?'tablet':'desktop';d.dataset.dev=k;d.dataset.ori=w>innerHeight?'land':'port';d.classList.toggle('touch',touch)}
devFit();addEventListener('resize',devFit);
/* Tự căn chỉnh giao diện theo màn hình đang dùng: chạy lại khi mở phần mềm, xoay màn hình, đổi cỡ cửa sổ, đổi cỡ chữ và mỗi lần danh sách thay đổi */
function fitRows(){
  document.querySelectorAll(".orow").forEach(r=>{
    r.classList.remove("stk");r.style.gridTemplateColumns="";
    r.querySelectorAll(":scope>.lead,:scope>.fm,:scope>.t1,:scope>.tl").forEach(c=>c.classList.remove("lead","fm","t1","tl"));
    const K=[...r.children];if(K.length<3||!r.clientWidth)return;
    const m=K.find(c=>parseFloat(getComputedStyle(c).flexGrow)>0);if(!m)return;
    const tight=m.getBoundingClientRect().width<150||r.scrollWidth>r.clientWidth+1;if(!tight)return;
    const mi=K.indexOf(m),lead=K.slice(0,mi),tail=K.slice(mi+1);if(!tail.length)return;
    lead.forEach(c=>c.classList.add("lead"));m.classList.add("fm");
    tail[0].classList.add("t1");tail[tail.length-1].classList.add("tl");
    r.style.gridTemplateColumns=(lead.length?"auto ":"")+"minmax(0,1fr)"+" auto".repeat(Math.max(0,tail.length-1));
    r.classList.add("stk");
    if(!lead.length){m.style.gridColumn="1/-1"}
  })
}
function fitAll(){try{devFit();fitRows()}catch(e){}}
let _ft=0;const fitSoon=()=>{cancelAnimationFrame(_ft);_ft=requestAnimationFrame(fitAll)};
{const v=window.view;window.view=function(){const r=v.apply(this,arguments);fitAll();return r}}
addEventListener("resize",fitSoon);addEventListener("orientationchange",()=>setTimeout(fitSoon,250));
try{new MutationObserver(fitSoon).observe(document.getElementById("app"),{childList:true,subtree:true})}catch(e){}
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitSoon)}catch(e){}
try{new ResizeObserver(fitSoon).observe(document.getElementById("app"))}catch(e){}
fitSoon();
addEventListener('orientationchange',()=>setTimeout(devFit,250));
</script>
